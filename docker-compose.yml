name: printer-dashboard

services:
  printer-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: printer-dashboard:1.0
    container_name: printer-dashboard
    restart: unless-stopped

    # Published on the host loopback only. The shared nginx reverse proxy
    # (https://printer-dashboard.irt.co.id) connects to 127.0.0.1:8090.
    # The app listens on 8080 inside the container, so the host's 8080
    # (used by IT-assets) is left untouched.
    ports:
      - "127.0.0.1:8090:8080"

    # Dedicated bridge with a fixed interface name (br-printerdash) so the host
    # firewall (nftables) can allow this container to reach the printers.
    # See the "Docker deployment" section in README.md.
    networks:
      - printerdash

    volumes:
      # Runtime data (state/history/stock) persists on the host.
      - ./data:/app/data
      # Printers, thresholds and notifications: edit on the host, then restart.
      - ./config.json:/app/config.json:ro

    environment:
      TZ: Asia/Jakarta

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 256

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/state', timeout=8)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  printerdash:
    name: printer-dashboard_printerdash
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-printerdash
