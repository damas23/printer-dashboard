# nginx vhost for the Printer Dashboard.
#
# Deployed as part of the shared reverse proxy at /opt/nginx/nginx.conf
# (the official nginx:1.28-alpine container, host networking).
#
# The container is published on host loopback 127.0.0.1:8090, so the proxy
# reaches it through the upstream below. Add the `upstream` block inside the
# `http { ... }` block and the two `server` blocks alongside the other vhosts,
# then: docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload

upstream printer_dashboard {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name printer-dashboard.irt.co.id;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name printer-dashboard.irt.co.id;

    location / {
        proxy_pass http://printer_dashboard;
    }
}
