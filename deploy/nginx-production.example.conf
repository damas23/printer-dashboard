# EXAMPLE for the existing shared Nginx, running with host networking.
# Do NOT replace /opt/nginx/nginx.conf with this file: keep other app vhosts,
# global settings and current TLS certificate configuration.
# Add these upstream blocks inside the existing http {}:
upstream printer_dashboard_ui {
    server 127.0.0.1:8090;
    keepalive 16;
}
upstream printer_dashboard_api {
    server 127.0.0.1:8092;
    keepalive 16;
}

