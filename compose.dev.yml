# Laptop: dedicated HTTP entry point; no external host configuration needed.
name: printer-dashboard-dev
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PRINTER_HTTP_PORT:-8090}:8080'
    volumes:
      - ./deploy/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    networks: [web]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /run]
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
networks:
  printerdash:
    name: printer-dashboard-dev_printerdash
    driver_opts:
      com.docker.network.bridge.name: br-printerdev
